services:

  cgroup-exporter:
    build: ./cgroup-exporter
    container_name: cgroup-exporter
    restart: always
    privileged: true
    pid: host
    volumes:
      - /sys/fs/cgroup:/host/sys/fs/cgroup:ro
      - /proc:/host/proc:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - 9100:9100

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: always
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - 9090:9090
    depends_on:
      - cgroup-exporter

  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: always
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - 3100:3100
    volumes:
      - loki-data:/loki

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    restart: always
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: always
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - 3000:3000
    depends_on:
      - prometheus

  tempo:
    image: grafana/tempo:2.6.1
    container_name: tempo
    restart: always
    user: root # so the named volume is writable
    command: -config.file=/etc/tempo/tempo.yml
    volumes:
      - ./tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jobs
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jobs"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    restart: always
    ports:
      - "15672:15672" # management UI (guest/guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 10

  server:
    container_name: server
    build: ./server
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/jobs?sslmode=disable
      AMQP_URL: amqp://guest:guest@rabbitmq:5672/
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317
      # TRACE_SAMPLE_RATIO: "1.0"   # lower to sample fewer traces under load
    ports:
      - "8080:8080"
      - "9464:9464"
    mem_limit: 256m
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:8080/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    build: ./server
    command: ["/worker"]
    container_name: worker
    restart: always
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/jobs?sslmode=disable
      AMQP_URL: amqp://guest:guest@rabbitmq:5672/
      CONSUMER_COUNT: "5"
      WORK_DURATION: 10s
      DB_MAX_CONNS: "10"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  client:
    build: ./client
    container_name: client
    environment:
      SERVER_URL: http://server:8080/export-csv
      TOTAL_REQUESTS: "10000"
      MAX_ITERATIONS: 100
      METRICS_FILE: /metrics/client.prom
    volumes:
      - client-metrics:/metrics
    depends_on:
      server:
        condition: service_healthy
    ulimits:
      nofile: { soft: 65536, hard: 65536 }

  client-metrics:
    build: ./metrics-server
    container_name: client-metrics
    environment:
      METRICS_FILE: /metrics/client.prom
    volumes:
      - client-metrics:/metrics:ro
    ports:
      - "9465:9465"

volumes:
  tempo-data:
  postgres-data:
  client-metrics:
  prometheus-data:
  grafana-data:
  loki-data: